openapi: 3.0.0
info:
  title: Textile Manufacturing System API
  version: 1.0.0
  description: Secure backend API for the Textile Manufacturing System.
servers:
  - url: http://localhost:5000/api
    description: Development Server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Internal Server Error or Validation Failed
security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health Check
      security: []
      responses:
        '200':
          description: API is running successfully

  /auth/signup:
    post:
      summary: Register a new user (Super Admin Only)
      tags:
        - Authentication
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  format: password
                  example: StrongPassword123!
                role:
                  type: string
                  enum: [ADMIN, PRODUCTION_MANAGER, INVENTORY_MANAGER, DYEING_SUPERVISOR, WEAVING_SUPERVISOR, QC_INSPECTOR, WAREHOUSE_STAFF]
                department:
                  type: string
                  enum: [SPINNING, WEAVING, DYEING, FINISHING, PACKAGING, WAREHOUSE, MANAGEMENT]
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Validation error
        '409':
          description: User already exists

  /auth/login:
    post:
      summary: Authenticate user and get JWT
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@textile.local
                password:
                  type: string
                  format: password
                  example: Admin@123!
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    type: string
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      summary: Get current authenticated user
      tags:
        - Authentication
      responses:
        '200':
          description: Returns decoded JWT payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

  /auth/logout:
    post:
      summary: Logout user
      tags:
        - Authentication
      responses:
        '200':
          description: Logged out successfully
        '401':
          description: Unauthorized

  /inventory/items:
    get:
      summary: Get all inventory items
      tags:
        - Inventory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Returns array of items

  /inventory/items/{itemId}:
    patch:
      summary: Edit an inventory item
      tags:
        - Inventory
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                minStock:
                  type: number
                isActive:
                  type: boolean
      responses:
        '200':
          description: Item updated
          
  /inventory/items/{itemId}/stock:
    get:
      summary: Get item stock balance
      tags:
        - Inventory
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Returns stock balances

  /inventory/receipts:
    post:
      summary: Record incoming raw materials
      tags:
        - Inventory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - itemId
                - warehouseId
                - quantity
                - internalBatchNumber
              properties:
                itemId:
                  type: string
                  format: uuid
                warehouseId:
                  type: string
                  format: uuid
                quantity:
                  type: number
                  example: 500
                internalBatchNumber:
                  type: string
                  example: "BATCH-1001"
                supplierBatchNumber:
                  type: string
                referenceId:
                  type: string
                reason:
                  type: string
      responses:
        '201':
          description: Receipt recorded successfully
        '400':
          description: Validation or business rule error

  /inventory/movements:
    post:
      summary: Process stock consumption, transfers, or adjustments
      tags:
        - Inventory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - itemId
                - type
                - quantity
              properties:
                itemId:
                  type: string
                  format: uuid
                sourceWarehouseId:
                  type: string
                  format: uuid
                destinationWarehouseId:
                  type: string
                  format: uuid
                batchId:
                  type: string
                  format: uuid
                type:
                  type: string
                  enum: [TRANSFER_IN, TRANSFER_OUT, ADJUSTMENT_IN, ADJUSTMENT_OUT, CONSUMPTION]
                quantity:
                  type: number
                referenceId:
                  type: string
                reason:
                  type: string
      responses:
        '201':
          description: Movement processed successfully
        '400':
          description: Validation or business rule error (e.g. Insufficient stock)

  /inventory/reservations:
    post:
      summary: Reserve materials for planned production
      tags:
        - Inventory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - itemId
                - warehouseId
                - productionJobId
                - quantity
              properties:
                itemId:
                  type: string
                  format: uuid
                warehouseId:
                  type: string
                  format: uuid
                productionJobId:
                  type: string
                  example: "JOB-102"
                quantity:
                  type: number
                  example: 150
      responses:
        '201':
          description: Reservation created successfully
        '400':
          description: Validation or business rule error
